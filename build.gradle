import xyz.wagyourtail.unimined.mapping.formats.at.LegacyATReader

plugins {
    alias(libs.plugins.unimined)
    id 'blockhelper.build-conventions'
}

group = project.mod_group
version = project.mod_version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(6)
    }
}

repositories {
    flatDir {
        name = 'libs'
        dirs('libs')
    }
    unimined.fabricMaven
    unimined.legacyFabricMaven
    unimined.minecraftForgeMaven
    unimined.wagYourMaven('releases')
}

LegacyATReader.leinient = true // Forge's AT just ignores invalid entries

unimined.minecraft {
    version project.mc_version

    minecraftForge {
        loader project.forge_version
    }

    mappings {
        stubs(["official", "searge"]) {
            c("BaseMod", "net/minecraft/src/BaseMod")
            c("BaseModMp", "net/minecraft/src/BaseModMp")
            c("ModLoader", "net/minecraft/src/ModLoader")
            c("ModLoaderMp", "net/minecraft/src/ModLoaderMp")
            c("mod_BlockHelper", "net/minecraft/src/mod_BlockHelper")
            c("mod_BlockHelper\$Accessor", "net/minecraft/src/mod_BlockHelper\$Accessor")
            c("Packet200ModLoader", "net/minecraft/src/Packet200ModLoader")
            c("Packet230ModLoader", "net/minecraft/src/Packet230ModLoader")
        }
    }

    mods.modImplementation {
        remapper ext.configureSigFixRemapper
    }
}

dependencies {
}
