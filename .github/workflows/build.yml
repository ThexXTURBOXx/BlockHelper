name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Download JDK 6
        run: |
          download_url="https://github.com/NicosMinecraftArchive/jdk1.6.0_45/raw/refs/heads/master/jdk-6u45-linux-x64.tar.gz"
          wget -O $RUNNER_TEMP/java_package.tar.gz $download_url

      - name: Set up JDK 6
        uses: actions/setup-java@v5
        with:
          distribution: 'jdkfile'
          jdkFile: ${{ runner.temp }}/java_package.tar.gz
          java-version: '1.6'
          architecture: x64
          mvn-toolchain-vendor: 'Oracle'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'

      - name: Build with Gradle
        run: ./gradlew build
